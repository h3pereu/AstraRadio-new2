<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375, initial-scale=1.0" />
  <title>Astra Radio – Loading Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0B1014;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .screen {
      width: 375px;
      height: 812px;
      background: #0B1014;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background glow */
    .ambient {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,0.07) 0%, transparent 70%);
      animation: ambientPulse 3s ease-in-out infinite;
    }

    @keyframes ambientPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%       { transform: scale(1.15); opacity: 1; }
    }

    /* Logo wrapper */
    .logo-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 64px;
      animation: logoEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes logoEntrance {
      from { opacity: 0; transform: scale(0.78); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* Glow ring behind logo */
    .glow-ring {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,229,255,0.18) 0%, transparent 68%);
      animation: glowPulse 2.4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1);    opacity: 0.7; }
      50%       { transform: scale(1.18); opacity: 1; }
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      position: relative;
      z-index: 1;
      /* drop-shadow matches the cyan accent */
      filter: drop-shadow(0 0 18px rgba(0,229,255,0.45));
    }

    /* Dots loader */
    .dots {
      display: flex;
      gap: 10px;
      animation: logoEntrance 0.9s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00E5FF;
    }

    .dot:nth-child(1) { animation: bounce 1.2s 0.0s ease-in-out infinite; }
    .dot:nth-child(2) { animation: bounce 1.2s 0.18s ease-in-out infinite; }
    .dot:nth-child(3) { animation: bounce 1.2s 0.36s ease-in-out infinite; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0);   opacity: 0.35; }
      40%            { transform: translateY(-10px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="ambient"></div>

    <div class="logo-wrap">
      <div class="glow-ring"></div>
      <img class="logo" src="../splash-icon.png" alt="Astra Radio" />
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
